- name: configure frontend
  hosts: frontend
  become: yes
  tasks:
    - name: install nginx
      dnf:
        name: nginx
        state: present
    - name: start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes
    - name: Find all contents inside directory
      ansible.builtin.find:
        path: /usr/share/nginzx/html
        recursive: true
        hidden: true
        file-type: any
      register: directory-contents
