- name: configure frontend
  hosts: frontend
  become: yes
  tasks:
    - name: install nginx
      dnf:
        name: nginx
        state: present
    - name: start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes
    - name: Find all contents inside directory
      ansible.builtin.find:
        path: /user/share/nginx/html/
        recurse: yes
        hidden: yes
        file-type: any
      register: directory_contents
